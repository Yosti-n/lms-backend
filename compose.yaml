name: ${COMPANY_PROJECT_NAME:-lms}-backend-dev

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: ${COMPANY_PROJECT_NAME:-lms}-backend-dev
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-lms}
      DB_USERNAME: ${DB_USERNAME:-lms}
      DB_PASSWORD: ${DB_PASSWORD:-lms}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - main-net-dev

  db:
    image: mariadb:10.11
    container_name: ${COMPANY_PROJECT_NAME:-lms}-backend-db-dev
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-lms}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_USER: ${DB_USERNAME:-lms}
      MARIADB_PASSWORD: ${DB_PASSWORD:-lms}
      TZ: America/Lima
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - db_data_dev:/var/lib/mysql
      - ./docker/mariadb/my.cnf:/etc/mysql/conf.d/application.cnf:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h 127.0.0.1 -u root -p$$MARIADB_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - main-net-dev

volumes:
  backend_node_modules:
    name: ${COMPANY_PROJECT_NAME:-lms}-backend-node-modules-dev
  db_data_dev:
    name: ${COMPANY_PROJECT_NAME:-lms}-backend-db-data-dev

networks:
  main-net-dev:
    name: ${COMPANY_PROJECT_NAME:-lms}-shared-net-dev
    driver: bridge
